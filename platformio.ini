; PlatformIO project for the GeekMagic SmallTV (ESP-12F / ESP8266).
; Build: pio run -e smalltv
; Artifact: .pio/build/smalltv/firmware.bin
; OTA: upload firmware.bin through the device web UI.

[platformio]
default_envs = smalltv

[env:smalltv]
platform = espressif8266
board = esp12e
framework = arduino
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m1m.ld
extra_scripts = pre:extra_script.py
monitor_speed = 115200
upload_speed = 921600
build_flags =
	-D SMALLTV_ESP8266
	-D WITH_RADAR=1
	-D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
	-D ARDUINOJSON_USE_DOUBLE=0
	-D MQTT_MAX_PACKET_SIZE=768
build_src_flags =
	-iquote src
	-iquote src/features/usage
	-iquote src/features/radar
	-iquote src/features/notify
	-iquote src/features/ha
build_src_filter =
	+<*>
lib_deps =
	bblanchon/ArduinoJson @ ^7.2.0
	moononournation/GFX Library for Arduino @ ^1.5.0
	knolleary/PubSubClient @ ^2.8

; Same board without Home Assistant screens. Usage metrics stay available.
[env:smalltv_lean]
extends = env:smalltv
build_flags =
	-D SMALLTV_ESP8266
	-D SMALLTV_LEAN
	-D WITH_RADAR=0
	-D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
	-D ARDUINOJSON_USE_DOUBLE=0
	-D WITH_HA=0
	-D MQTT_MAX_PACKET_SIZE=768

; Minimal ESP8266 OTA loader for SmallTV-ultra units whose stock OTA slot is
; too small for the full firmware.
[env:smalltv_loader]
platform = espressif8266
board = esp12e
framework = arduino
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m1m.ld
build_flags =
	-D LOADER_BUILD
	-D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
build_src_filter = -<*> +<loader.cpp>
