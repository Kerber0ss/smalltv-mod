name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-
      - name: Install PlatformIO
        run: pip install platformio==6.1.19
      - name: Build ESP8266 firmware
        run: pio run -e smalltv -e smalltv_lean -e smalltv_loader
      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp .pio/build/smalltv/firmware.bin dist/smalltv-mod-firmware.bin
          cp .pio/build/smalltv_lean/firmware.bin dist/smalltv-mod-firmware-lean.bin
          cp .pio/build/smalltv_loader/firmware.bin dist/smalltv-mod-loader.bin
      - uses: actions/upload-artifact@v4
        with:
          name: smalltv-mod-firmware
          path: dist/
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
